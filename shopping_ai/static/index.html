<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おかいものAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍</text></svg>">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1f2328; --muted: #6b7280; --line: #e5e3de;
    --accent: #e8590c; --accent-ink: #ffffff; --user: #fff1e6; --chip: #f1efea; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --panel: #1f2125; --ink: #e8e8ea; --muted: #9aa0a6; --line: #2f3237;
            --accent: #ff7a2f; --accent-ink: #16171a; --user: #3a2a1e; --chip: #2a2d31; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
         font-size: 15px; line-height: 1.7; }
  .app { display: grid; grid-template-columns: 1fr 300px; height: 100vh; max-width: 1200px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 12px; }
  header button { margin-left: auto; }
  .main { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.user img { max-width: 160px; max-height: 160px; border-radius: 8px; display: block; margin-bottom: 6px; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.ai :first-child { margin-top: 0; } .msg.ai :last-child { margin-bottom: 0; }
  .msg.ai table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; margin: 8px 0; }
  .msg.ai th, .msg.ai td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .msg.ai th { background: var(--chip); }
  .msg.ai td, .msg.ai th { min-width: 5.5em; }
  .msg.ai a { color: var(--accent); }
  .msg.ai code { background: var(--chip); padding: 1px 4px; border-radius: 4px; }
  .msg.ai pre { background: var(--chip); padding: 8px; border-radius: 8px; overflow-x: auto; }
  .msg.ai blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .msg.ai h3, .msg.ai h4, .msg.ai h5 { margin: 12px 0 4px; font-size: 15px; }
  .msg.ai ul, .msg.ai ol { padding-left: 1.4em; margin: 6px 0; }
  .status { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .status:empty { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; flex: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .error { color: var(--error); font-size: 13px; }
  .welcome { color: var(--muted); text-align: center; margin: auto; max-width: 520px; }
  .welcome h2 { color: var(--ink); font-size: 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .chip { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
          cursor: pointer; font-size: 13px; color: var(--ink); }
  .chip:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: flex-end; }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
             font: inherit; background: var(--panel); color: var(--ink); max-height: 160px; min-height: 44px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  #attachPreview { display: flex; gap: 6px; padding: 0 16px; }
  #attachPreview img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  aside { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  aside h3 { font-size: 14px; margin: 0 0 8px; }
  .cart-item { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 8px 0;
               border-bottom: 1px solid var(--line); }
  .cart-item .meta { color: var(--muted); font-size: 12px; }
  .cart-item button { padding: 2px 8px; font-size: 12px; align-self: center; }
  .total { display: flex; justify-content: space-between; font-weight: 700; margin-top: 8px; }
  .empty { color: var(--muted); font-size: 13px; }
  .prefs div { font-size: 13px; } .prefs span { color: var(--muted); }
  .cards { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; align-self: stretch; max-width: 100%; }
  .card { flex: 0 0 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .card .cat { color: var(--muted); font-size: 11px; }
  .card .name { font-weight: 700; line-height: 1.4; }
  .card .price { font-size: 16px; font-weight: 700; }
  .card .rate { color: var(--muted); font-size: 12px; }
  .card .stock-low { color: var(--error); font-size: 12px; }
  .card select { font: inherit; font-size: 12px; padding: 4px; border-radius: 8px; border: 1px solid var(--line);
                 background: var(--panel); color: var(--ink); }
  .card button { margin-top: auto; font-size: 13px; }
  .card .added { color: var(--muted); font-size: 12px; text-align: center; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 92%; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .main { border-right: 0; min-height: 0; }
    aside { border-top: 1px solid var(--line); max-height: 32vh; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <header>
      <span style="font-size:22px">🛍</span>
      <div><h1>おかいものAI</h1><div class="sub">探す・比べる・選ぶを、会話で。</div></div>
      <button id="reset" type="button">新しい会話</button>
    </header>
    <div id="log">
      <div class="welcome" id="welcome">
        <h2>何をお探しですか？</h2>
        <p>予算や用途を教えてくれれば、ぴったりの商品を一緒に探します。最新の価格やレビューもウェブで調べます。写真を送って「これに似たもの」も OK。</p>
        <div class="chips">
          <button class="chip" type="button">3万円以内で通勤用のノイキャンイヤホンが欲しい</button>
          <button class="chip" type="button">母の誕生日プレゼント、5千円くらいで何がいい？</button>
          <button class="chip" type="button">初めてのキャンプで最低限そろえるものは？</button>
          <button class="chip" type="button">敏感肌でも使える化粧水と日焼け止めを教えて</button>
        </div>
      </div>
    </div>
    <div id="attachPreview"></div>
    <form id="form">
      <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
      <button type="button" id="attach" title="画像を添付">📷</button>
      <textarea id="input" rows="1" placeholder="例: 1万円以内で弟へのプレゼント"></textarea>
      <button class="primary" id="send" type="submit">送信</button>
    </form>
  </div>
  <aside>
    <section>
      <h3>🛒 カート</h3>
      <div id="cart"><div class="empty">まだ何も入っていません</div></div>
    </section>
    <section class="prefs">
      <h3>📝 覚えている好み</h3>
      <div id="prefs"><div class="empty">会話の中で教えてもらった条件をここに表示します</div></div>
    </section>
  </aside>
</div>
<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send");
let sessionId = null;
try { sessionId = localStorage.getItem("okaimono_session"); } catch (e) {}
let pendingImages = [];
let busy = false;

const yen = (n) => "¥" + Number(n).toLocaleString("ja-JP");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// 小さな Markdown レンダラー（外部ライブラリ不要）。先に全体を HTML エスケープしてから整形するので安全。
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2">$1</a>')
       .replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g, '$1<a href="$2">$2</a>')
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
       .replace(/~~([^~]+)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src) {
  const lines = esc(src).split("\n"), out = [];
  let i = 0;
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${buf.join("\n")}</code></pre>`); continue;
    }
    if (isRow(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      const head = cells(l); i += 2;
      const rows = [];
      while (i < lines.length && isRow(lines[i])) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>"
        + rows.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { const n = Math.min(m[1].length + 2, 6); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l), items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map((t) => `<li>${inline(t)}</li>`).join("") + `</${tag}>`);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^&gt;\s?/.test(l)) {
      const buf = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) buf.push(inline(lines[i++].replace(/^&gt;\s?/, "")));
      out.push(`<blockquote>${buf.join("<br>")}</blockquote>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isRow(lines[i]) && !/^(#{1,4}\s|```|\s*([-*+]|\d+[.)])\s+|&gt;)/.test(lines[i])) buf.push(inline(lines[i++]));
    if (!buf.length) buf.push(inline(lines[i++]));
    out.push(`<p>${buf.join("<br>")}</p>`);
  }
  return out.join("");
}

function saveSession(id) { sessionId = id; try { localStorage.setItem("okaimono_session", id); } catch (e) {} }
function scroll() { log.scrollTop = log.scrollHeight; }

function renderCart(cart) {
  const el = $("#cart");
  if (!cart || !cart.items.length) { el.innerHTML = '<div class="empty">まだ何も入っていません</div>'; return; }
  el.innerHTML = cart.items.map((i) => `
    <div class="cart-item"><div><div>${esc(i.name)}</div>
      <div class="meta">${esc(i.product_id)}${i.option ? " ・ " + esc(i.option) : ""} ・ ${yen(i.unit_price_jpy)} × ${i.quantity}</div></div>
      <button type="button" data-pid="${esc(i.product_id)}" title="削除">✕</button></div>`).join("")
    + `<div class="total"><span>合計（${cart.item_count}点）</span><span>${yen(cart.total_jpy)}</span></div>`;
}
function renderPrefs(prefs) {
  const el = $("#prefs"), entries = Object.entries(prefs || {});
  el.innerHTML = entries.length ? entries.map(([k, v]) => `<div><span>${esc(k)}:</span> ${esc(v)}</div>`).join("")
    : '<div class="empty">会話の中で教えてもらった条件をここに表示します</div>';
}

$("#cart").addEventListener("click", async (e) => {
  const pid = e.target.dataset && e.target.dataset.pid;
  if (!pid || !sessionId) return;
  const r = await fetch(`/api/session/${sessionId}/cart/${encodeURIComponent(pid)}`, { method: "DELETE" });
  if (r.ok) renderCart((await r.json()).cart);
});

function addUserMsg(text, images) {
  $("#welcome")?.remove();
  const div = document.createElement("div");
  div.className = "msg user";
  images.forEach((img) => { const im = document.createElement("img"); im.src = `data:${img.media_type};base64,${img.data}`; div.appendChild(im); });
  div.appendChild(document.createTextNode(text));
  log.appendChild(div); scroll();
}

async function send(text) {
  if (busy || (!text.trim() && !pendingImages.length)) return;
  busy = true; sendBtn.disabled = true;
  const images = pendingImages; pendingImages = []; $("#attachPreview").innerHTML = "";
  addUserMsg(text, images);
  input.value = ""; autosize();

  const ai = document.createElement("div"); ai.className = "msg ai";
  const body = document.createElement("div");
  const status = document.createElement("div"); status.className = "status";
  status.innerHTML = '<span class="dot"></span><span>考えています…</span>';
  ai.append(body, status); log.appendChild(ai); scroll();
  let text_ = "", raf = null, suggestions = [];
  document.querySelectorAll(".suggest").forEach((el) => el.remove());
  const flush = () => { raf = null; body.innerHTML = md(text_); body.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; }); scroll(); };

  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text, images }) });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || `HTTP ${res.status}`); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "session") { saveSession(ev.session_id); renderCart(ev.cart); renderPrefs(ev.preferences); }
        else if (ev.type === "text") { text_ += ev.text; if (!raf) raf = requestAnimationFrame(flush); }
        else if (ev.type === "status") { status.innerHTML = ev.text ? `<span class="dot"></span><span>${esc(ev.text)}</span>` : ""; }
        else if (ev.type === "cart") renderCart(ev.cart);
        else if (ev.type === "preferences") renderPrefs(ev.preferences);
        else if (ev.type === "suggestions") suggestions = ev.items;
        else if (ev.type === "error") { const e = document.createElement("div"); e.className = "error"; e.textContent = "⚠ " + ev.text; ai.appendChild(e); }
      }
    }
  } catch (err) {
    const e = document.createElement("div"); e.className = "error"; e.textContent = "⚠ " + err.message; ai.appendChild(e);
  } finally {
    flush(); status.remove();
    if (!text_.trim() && !ai.querySelector(".error")) ai.remove();
    busy = false; sendBtn.disabled = false; input.focus();
  }
  await renderProductCards(text_, ai);
  renderSuggestions(suggestions);
}

// 応答に出てきた商品ID（例: EL-001）から商品カードを作る
async function renderProductCards(text, after) {
  const ids = [...new Set(text.match(/\b[A-Z]{2}-\d{3}\b/g) || [])].slice(0, 12);
  if (!ids.length || !after.isConnected) return;
  let products = [];
  try { products = (await (await fetch("/api/products?ids=" + ids.join(","))).json()).products; } catch (e) { return; }
  if (!products.length) return;
  const row = document.createElement("div"); row.className = "cards";
  for (const p of products) {
    const card = document.createElement("div"); card.className = "card";
    const opts = [];
    if (p.sizes) opts.push(`<select data-k="size"><option value="">サイズを選択</option>${p.sizes.map((x) => `<option>${esc(x)}</option>`).join("")}</select>`);
    if (p.colors) opts.push(`<select data-k="color"><option value="">カラーを選択</option>${p.colors.map((x) => `<option>${esc(x)}</option>`).join("")}</select>`);
    card.innerHTML = `<div class="cat">${esc(p.category)} ・ ${esc(p.id)}</div>
      <div class="name">${esc(p.name)}</div><div class="cat">${esc(p.brand)}</div>
      <div class="price">${yen(p.price_jpy)}</div>
      <div class="rate">★ ${p.rating.toFixed(1)}（${p.reviews.toLocaleString("ja-JP")}件）</div>
      ${p.stock === 0 ? '<div class="stock-low">在庫切れ</div>' : p.stock <= 10 ? `<div class="stock-low">残り ${p.stock} 点</div>` : ""}
      ${opts.join("")}
      <button type="button" class="primary" ${p.stock === 0 ? "disabled" : ""}>カートに入れる</button>`;
    card.querySelector("button").addEventListener("click", async (e) => {
      const sels = [...card.querySelectorAll("select")];
      if (sels.some((x) => !x.value)) { alert("サイズ・カラーを選んでください"); return; }
      const option = sels.map((x) => x.value).join(" / ");
      if (!sessionId) return;
      const r = await fetch(`/api/session/${sessionId}/cart`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product_id: p.id, quantity: 1, option }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { alert(data.detail || "追加できませんでした"); return; }
      renderCart(data.cart);
      e.target.textContent = "追加しました ✓";
      setTimeout(() => { e.target.textContent = "カートに入れる"; }, 1500);
    });
    row.appendChild(card);
  }
  after.after(row); scroll();
}

function renderSuggestions(items) {
  if (!items || !items.length) return;
  const wrap = document.createElement("div"); wrap.className = "suggest";
  for (const t of items) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = t;
    b.addEventListener("click", () => send(t));
    wrap.appendChild(b);
  }
  log.appendChild(wrap); scroll();
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); } });
$("#form").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => send(c.textContent)));
$("#attach").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", async (e) => {
  for (const f of [...e.target.files].slice(0, 4 - pendingImages.length)) {
    if (f.size > 5 * 1024 * 1024) { alert(`${f.name} は 5MB を超えています`); continue; }
    const data = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.readAsDataURL(f); });
    pendingImages.push({ media_type: f.type, data });
    const im = document.createElement("img"); im.src = `data:${f.type};base64,${data}`; $("#attachPreview").appendChild(im);
  }
  e.target.value = "";
});
$("#reset").addEventListener("click", async () => {
  if (busy) return;
  if (sessionId) await fetch(`/api/session/${sessionId}/reset`, { method: "POST" });
  location.reload();
});
(async () => {
  if (!sessionId) return;
  const r = await fetch(`/api/session/${sessionId}`);
  if (r.ok) { const s = await r.json(); renderCart(s.cart); renderPrefs(s.preferences); }
})();
</script>
</body>
</html>
